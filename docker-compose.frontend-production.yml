services:
  frontend:
    image: biblios-frontend:production
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        APP_VERSION: ${FRONTEND_VERSION:-unversioned}
        VCS_REF: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports: !override
      - "${FRONTEND_PUBLIC_PORT:-8080}:8080"
    environment: !reset {}
    volumes: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
